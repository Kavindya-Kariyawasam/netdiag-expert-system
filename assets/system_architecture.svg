<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#ffffff" stroke="#000000" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">
    Figure 1: NetDiag Expert System Architecture
  </text>
  <line x1="40" y1="46" x2="860" y2="46" stroke="#000000" stroke-width="1"/>

  <!-- LAYER 1: USER & INTERFACE -->
  <rect x="40" y="70" width="240" height="370" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="40" y="70" width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="1.5"/>
  <text x="160" y="90" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">
    User Interface Layer
  </text>

  <!-- User Box -->
  <rect x="60" y="115" width="200" height="45" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="160" y="135" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">End User / Technician</text>
  <text x="160" y="149" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9.5">Enters Symptoms / Answers Queries</text>

  <!-- Web GUI Box -->
  <rect x="60" y="180" width="200" height="75" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="160" y="200" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Web Browser GUI</text>
  <text x="70" y="218" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Forward Checklist &amp; Presets</text>
  <text x="70" y="233" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Backward Guided Triage Q&amp;A</text>
  <text x="70" y="247" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• HOW / WHY Explanation Panels</text>

  <!-- CLI Box -->
  <rect x="60" y="275" width="200" height="55" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="160" y="295" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Command-Line Interface</text>
  <text x="160" y="312" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9.5">Interactive Terminal (cli.py)</text>

  <!-- Flask API Box -->
  <rect x="60" y="350" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="160" y="370" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Flask Web API (app.py)</text>
  <text x="70" y="388" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• REST Endpoints (/api/forward)</text>
  <text x="70" y="402" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Session Manager (/api/backward)</text>


  <!-- LAYER 2: INFERENCE ENGINE -->
  <rect x="330" y="70" width="240" height="370" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="330" y="70" width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="90" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">
    Inference Engine (engine.py)
  </text>

  <!-- Forward Chaining Box -->
  <rect x="350" y="115" width="200" height="85" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="450" y="135" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Forward Chaining</text>
  <text x="360" y="153" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Data-driven fixed-point scan</text>
  <text x="360" y="168" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Intermediate state deduction</text>
  <text x="360" y="183" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Near-match calculation</text>

  <!-- Backward Chaining Box -->
  <rect x="350" y="215" width="200" height="95" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="450" y="235" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Backward Chaining</text>
  <text x="360" y="253" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Goal-driven depth-first proof</text>
  <text x="360" y="268" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Minimal interactive questioning</text>
  <text x="360" y="283" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Candidate backtracking</text>
  <text x="360" y="298" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Guided category triage</text>

  <!-- Explanation Facility Box -->
  <rect x="350" y="325" width="200" height="95" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="450" y="345" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Explanation Facility</text>
  <text x="360" y="363" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• HOW: Rule derivation tree</text>
  <text x="360" y="378" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• WHY: Active rule justification</text>
  <text x="360" y="393" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• WHY-NOT: Missing/failed facts</text>
  <text x="360" y="408" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Open-world unknown handling</text>


  <!-- LAYER 3: KNOWLEDGE BASE -->
  <rect x="620" y="70" width="240" height="370" fill="#fafafa" stroke="#000000" stroke-width="1.5"/>
  <rect x="620" y="70" width="240" height="30" fill="#eeeeee" stroke="#000000" stroke-width="1.5"/>
  <text x="740" y="90" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold">
    Knowledge Base (kb.py)
  </text>

  <!-- Production Rules Box -->
  <rect x="640" y="115" width="200" height="70" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="740" y="135" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">28 Production Rules</text>
  <text x="650" y="153" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• IF-THEN representation</text>
  <text x="650" y="168" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Conjunctions &amp; Negation (!)</text>

  <!-- Facts Box -->
  <rect x="640" y="195" width="200" height="75" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="740" y="215" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Facts &amp; Hypotheses</text>
  <text x="650" y="233" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• 30 Observable Leaf Facts</text>
  <text x="650" y="248" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• 4 Intermediate Hypotheses</text>
  <text x="650" y="263" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• 23 Terminal Diagnoses</text>

  <!-- Provenance Box -->
  <rect x="640" y="280" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="740" y="300" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Domain Provenance</text>
  <text x="650" y="318" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Microsoft Support &amp; Learn</text>
  <text x="650" y="333" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• Google Public DNS, Dell Tech</text>

  <!-- Presets Box -->
  <rect x="640" y="355" width="200" height="65" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="740" y="375" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">Presets &amp; Triage</text>
  <text x="650" y="393" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• 10 Canonical Benchmarks</text>
  <text x="650" y="408" fill="#333333" font-family="Arial, Helvetica, sans-serif" font-size="9.5">• 3 Problem Domains</text>


  <!-- ARROWS BETWEEN LAYERS -->
  <!-- UI to Engine -->
  <line x1="280" y1="210" x2="328" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="240" x2="282" y2="240" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="305" y="202" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.5">Facts</text>
  <text x="305" y="255" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.5">Results</text>

  <!-- Engine to KB -->
  <line x1="570" y1="210" x2="618" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="240" x2="572" y2="240" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="595" y="202" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.5">Match</text>
  <text x="595" y="255" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="8.5">Rules</text>
</svg>
