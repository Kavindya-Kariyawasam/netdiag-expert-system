<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1000" height="620" rx="16" fill="url(#grad-bg)"/>
  <rect width="1000" height="620" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    NetDiag Multi-Level Inference Network (Decision Graph)
  </text>
  <text x="500" y="58" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">
    Hierarchical Rule Chaining: Observable Leaf Facts &rarr; Intermediate Hypotheses (Deep Inference) &rarr; Final Diagnoses
  </text>

  <!-- COLUMN LABELS -->
  <rect x="50" y="80" width="240" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="170" y="99" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">LEVEL 1: OBSERVABLE SYMPTOMS</text>

  <rect x="380" y="80" width="240" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="99" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">LEVEL 2: INTERMEDIATE HYPOTHESES</text>

  <rect x="710" y="80" width="240" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="830" y="99" text-anchor="middle" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">LEVEL 3: FINAL DIAGNOSES</text>

  <!-- CLUSTER 1: ROUTER SUBSYSTEM -->
  <!-- Leaf Facts -->
  <g filter="url(#glow)">
    <rect x="50" y="125" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="145" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">no_internet_access=True</text>

    <rect x="50" y="165" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="185" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">power_light_on=False</text>

    <rect x="50" y="205" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="225" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">can_ping_router=False</text>

    <rect x="50" y="245" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="265" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">router_recently_rebooted=True</text>
  </g>

  <!-- Direct R1 Link to Diagnosis -->
  <path d="M 270 145 L 710 145" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <rect x="440" y="135" width="40" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="460" y="148" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">R1</text>

  <!-- Intermediate 1 -->
  <g filter="url(#glow)">
    <rect x="380" y="205" width="220" height="42" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="490" y="224" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">suspect_router_fault</text>
    <text x="490" y="238" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Derived via R2 (power_on &amp; ¬ping)</text>
  </g>

  <!-- Chaining to R2 -->
  <path d="M 270 145 L 320 145 L 320 215 L 380 215" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 270 221 L 380 221" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Intermediate to Diagnosis (R3) -->
  <path d="M 600 226 L 710 226" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="635" y="217" width="40" height="18" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="655" y="230" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">R3</text>

  <!-- CLUSTER 2: DNS & ISP SUBSYSTEM -->
  <g filter="url(#glow)">
    <rect x="50" y="300" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="320" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">can_ping_external_ip=True</text>

    <rect x="50" y="340" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="360" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">can_resolve_dns=False</text>

    <rect x="50" y="380" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="400" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">vpn_active=True</text>
  </g>

  <!-- Intermediate 2: suspect_dns_issue -->
  <g filter="url(#glow)">
    <rect x="380" y="320" width="220" height="42" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="490" y="339" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">suspect_dns_issue</text>
    <text x="490" y="353" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Derived via R8 (ext_ping &amp; ¬dns)</text>
  </g>

  <path d="M 270 320 L 380 335" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 270 356 L 380 345" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- From DNS issue to R9 and R10 -->
  <path d="M 600 335 L 660 335 L 660 310 L 710 310" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="645" y="303" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">R9</text>

  <path d="M 600 345 L 660 345 L 660 380 L 710 380" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="645" y="393" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">R10</text>

  <!-- CLUSTER 3: PERFORMANCE / HARDWARE SUBSYSTEM -->
  <g filter="url(#glow)">
    <rect x="50" y="440" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="460" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">system_slow=True &amp; high_cpu</text>

    <rect x="50" y="480" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="500" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">malware_scan_flagged=False</text>

    <rect x="50" y="520" width="220" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="540" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="10">new_software_installed=True</text>
  </g>

  <!-- Intermediate 3: suspect_resource_heavy -->
  <g filter="url(#glow)">
    <rect x="380" y="460" width="220" height="42" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="490" y="479" text-anchor="middle" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">suspect_resource_heavy_process</text>
    <text x="490" y="493" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Derived via R16 (slow &amp; cpu &amp; ¬malware)</text>
  </g>

  <path d="M 270 460 L 380 475" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <path d="M 600 481 L 710 481" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="635" y="472" width="40" height="18" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="655" y="485" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700">R17</text>

  <!-- FINAL DIAGNOSIS CARDS -->
  <g filter="url(#glow)">
    <!-- router_powered_off -->
    <rect x="710" y="125" width="240" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="143" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Router Powered Off</text>
    <text x="830" y="156" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Check power adapter/plug</text>

    <!-- router_hardware_fault -->
    <rect x="710" y="207" width="240" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="225" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Router Hardware Fault</text>
    <text x="830" y="238" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Unresponsive after reboot</text>

    <!-- dns_failure -->
    <rect x="710" y="291" width="240" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="309" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">DNS Resolution Failure</text>
    <text x="830" y="322" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Switch DNS to 1.1.1.1 / 8.8.8.8</text>

    <!-- vpn_dns_conflict -->
    <rect x="710" y="361" width="240" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="379" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">VPN DNS Routing Conflict</text>
    <text x="830" y="392" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Disconnect or change VPN DNS</text>

    <!-- new_software_resource_conflict -->
    <rect x="710" y="462" width="240" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="480" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Software Resource Conflict</text>
    <text x="830" y="493" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Inspect newly installed app</text>

    <!-- thermal_throttling -->
    <rect x="710" y="530" width="240" height="38" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="830" y="548" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Thermal Throttling (R23)</text>
    <text x="830" y="561" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="9">Overheating + High CPU Load</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="50" y="580" width="900" height="26" rx="6" fill="#1e293b"/>
  <circle cx="100" cy="593" r="5" fill="#38bdf8"/>
  <text x="115" y="597" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="10">Observable Symptom (Askable)</text>

  <circle cx="340" cy="593" r="5" fill="#fbbf24"/>
  <text x="355" y="597" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="10">Intermediate Hypothesis (Derived Only)</text>

  <circle cx="610" cy="593" r="5" fill="#34d399"/>
  <text x="625" y="597" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="10">Final Diagnosis &amp; Remedy</text>

  <text x="860" y="597" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="10">Total Rules: 28</text>
</svg>
