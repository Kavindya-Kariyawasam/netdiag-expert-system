<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="500" fill="#ffffff" stroke="#000000" stroke-width="1"/>

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">
    Figure 2: Multi-Level Inference Decision Graph (Sample Rule Chains)
  </text>
  <line x1="30" y1="46" x2="890" y2="46" stroke="#000000" stroke-width="1"/>

  <!-- Column Headers -->
  <rect x="40" y="60" width="230" height="28" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
  <text x="155" y="78" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">
    Level 1: Leaf Facts (Symptoms)
  </text>

  <rect x="345" y="60" width="230" height="28" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
  <text x="460" y="78" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">
    Level 2: Intermediate Hypotheses
  </text>

  <rect x="650" y="60" width="230" height="28" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
  <text x="765" y="78" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold">
    Level 3: Terminal Diagnoses
  </text>

  <!-- Level 1 Nodes -->
  <!-- Cluster A: Network -->
  <rect x="40" y="105" width="230" height="42" fill="#fafafa" stroke="#000000" stroke-width="1"/>
  <text x="155" y="123" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">no_internet_access</text>
  <text x="155" y="137" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="9">!power_light_on</text>

  <rect x="40" y="160" width="230" height="52" fill="#fafafa" stroke="#000000" stroke-width="1"/>
  <text x="155" y="178" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">no_internet_access</text>
  <text x="155" y="192" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="9">power_light_on AND !can_ping_router</text>
  <text x="155" y="204" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="8.5">(Local router link down)</text>

  <rect x="40" y="225" width="230" height="52" fill="#fafafa" stroke="#000000" stroke-width="1"/>
  <text x="155" y="243" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">can_ping_external_ip</text>
  <text x="155" y="257" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="9">!can_resolve_dns</text>
  <text x="155" y="269" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="8.5">(IP reachable, hostnames fail)</text>

  <rect x="40" y="290" width="230" height="42" fill="#fafafa" stroke="#000000" stroke-width="1"/>
  <text x="155" y="308" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">system_slow</text>
  <text x="155" y="322" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="9">high_cpu_usage (&gt; 85%)</text>

  <rect x="40" y="345" width="230" height="42" fill="#fafafa" stroke="#000000" stroke-width="1"/>
  <text x="155" y="363" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">high_cpu_usage</text>
  <text x="155" y="377" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="9">overheating_detected</text>

  <rect x="40" y="400" width="230" height="42" fill="#fafafa" stroke="#000000" stroke-width="1"/>
  <text x="155" y="418" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">blue_screen_recently (BSOD)</text>
  <text x="155" y="432" text-anchor="middle" fill="#555555" font-family="Arial, Helvetica, sans-serif" font-size="9">driver_outdated</text>


  <!-- Level 2 Nodes (Intermediate Hypotheses) -->
  <rect x="345" y="165" width="230" height="42" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="183" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">suspect_router_fault</text>
  <text x="460" y="197" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Router hardware unresponsive</text>

  <rect x="345" y="230" width="230" height="42" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="248" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">suspect_dns_issue</text>
  <text x="460" y="262" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Name resolution subsystem fault</text>

  <rect x="345" y="290" width="230" height="42" fill="#f0f0f0" stroke="#000000" stroke-width="1.5"/>
  <text x="460" y="308" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">suspect_resource_heavy_process</text>
  <text x="460" y="322" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">CPU/RAM resource starvation</text>


  <!-- Level 3 Nodes (Terminal Diagnoses) -->
  <rect x="650" y="105" width="230" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="123" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">router_powered_off</text>
  <text x="765" y="137" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Check power supply / switch</text>

  <rect x="650" y="155" width="230" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="173" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">router_hardware_fault</text>
  <text x="765" y="187" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Reboot failed; hardware defect</text>

  <rect x="650" y="205" width="230" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="223" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">isp_outage</text>
  <text x="765" y="237" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Multiple devices down; contact ISP</text>

  <rect x="650" y="255" width="230" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="273" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">dns_failure</text>
  <text x="765" y="287" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Configure public DNS (8.8.8.8)</text>

  <rect x="650" y="325" width="230" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="343" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">thermal_throttling</text>
  <text x="765" y="357" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Clean vents / check thermal paste</text>

  <rect x="650" y="380" width="230" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="765" y="398" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold">driver_crash</text>
  <text x="765" y="412" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9">Rollback/update device driver</text>


  <!-- ARROWS & LABELS -->
  <!-- Direct R1: Cluster 1 to router_powered_off -->
  <line x1="270" y1="126" x2="642" y2="126" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="440" y="116" width="30" height="18" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="455" y="129" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R1</text>

  <!-- R2: Cluster 2 to suspect_router_fault -->
  <line x1="270" y1="186" x2="337" y2="186" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="307" y="180" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R2</text>

  <!-- R3: suspect_router_fault + rebooted -> router_hardware_fault -->
  <line x1="575" y1="176" x2="642" y2="176" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="610" y="170" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R3</text>

  <!-- R6: suspect_router_fault + multiple_devices -> isp_outage -->
  <path d="M 575 195 L 610 195 L 610 226 L 642 226" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="618" y="210" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R6</text>

  <!-- R7: Cluster 3 to suspect_dns_issue -->
  <line x1="270" y1="251" x2="337" y2="251" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="307" y="245" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R7</text>

  <!-- R8: suspect_dns_issue + browser error -> dns_failure -->
  <line x1="575" y1="265" x2="642" y2="265" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="610" y="260" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R8</text>

  <!-- R14: Cluster 4 to suspect_resource_heavy_process -->
  <line x1="270" y1="311" x2="337" y2="311" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="307" y="305" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R14</text>

  <!-- R17: Cluster 5 to thermal_throttling -->
  <line x1="270" y1="355" x2="642" y2="355" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="440" y="346" width="30" height="18" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="455" y="359" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R17</text>

  <!-- R22: Cluster 6 to driver_crash -->
  <line x1="270" y1="410" x2="642" y2="410" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="440" y="401" width="30" height="18" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="455" y="414" text-anchor="middle" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold">R22</text>

  <!-- Bottom Legend -->
  <text x="460" y="475" text-anchor="middle" fill="#444444" font-family="Arial, Helvetica, sans-serif" font-size="9.5">
    Legend: Rectangles represent facts/hypotheses; labeled arrows represent production rules (IF antecedents THEN consequent).
  </text>
</svg>
